<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velvet Armor — Slicer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b0b0b;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 5;
        }
        .score-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
        }
        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-align: center;
        }
        p {
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="score-box">СЧЕТ: <span id="score">0</span></div>
        <div class="score-box">ПРАВЫХ: <span id="missed">0</span> / 3</div>
    </div>

    <div id="startScreen">
        <h1>V / A — SLICER</h1>
        <p>Режь брендовый шмот, обходи паленку</p>
        <button class="btn" onclick="startGame()">ИГРАТЬ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let missed = 0;
        let isPlaying = false;
        let items = [];
        let particles = [];
        let trail = [];

        // База вещей с реальными PNG-изображениями (прозрачный фон)
        const itemSources = [
            { name: "Stone Island Tee", url: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300&auto=format&fit=crop&q=80" },
            { name: "Valentino Kicks", url: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=300&auto=format&fit=crop&q=80" },
            { name: "Gucci Jacket", url: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=300&auto=format&fit=crop&q=80" },
            { name: "Givenchy Tee", url: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=300&auto=format&fit=crop&q=80" },
            { name: "Raf Simons", url: "https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=300&auto=format&fit=crop&q=80" },
            { name: "Rick Owens Geobasket", url: "https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=300&auto=format&fit=crop&q=80" },
            { name: "Off-White Hoodie", url: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=300&auto=format&fit=crop&q=80" },
            { name: "Nike Sneakers", url: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300&auto=format&fit=crop&q=80" },
            { name: "Puma Archive", url: "https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=300&auto=format&fit=crop&q=80" },
            { name: "Maison Margiela", url: "https://images.unsplash.com/photo-1539185441755-769473a23570?w=300&auto=format&fit=crop&q=80" },
            { name: "Olimpika Zip", url: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300&auto=format&fit=crop&q=80" },
            { name: "❌ Убитая реплика", url: "", isBomb: true }
        ];

        // Предзагрузка картинок в память браузера для плавной игры
        const loadedItems = itemSources.map(item => {
            if (item.url) {
                const img = new Image();
                img.src = item.url;
                return { ...item, img: img };
            }
            return { ...item, img: null };
        });

        class Item {
            constructor() {
                this.x = Math.random() * (canvas.width - 160) + 80;
                this.y = canvas.height + 80;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = -(Math.random() * 5 + 13);
                this.gravity = 0.35;
                this.data = loadedItems[Math.floor(Math.random() * loadedItems.length)];
                this.size = 85; // Размер картинки в игре
                this.sliced = false;
                this.angle = 0;
                this.vAngle = (Math.random() - 0.5) * 0.08;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.angle += this.vAngle;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                if (this.data.isBomb) {
                    // Рисуем стильный маркер паленки
                    ctx.beginPath();
                    ctx.arc(0, 0, 40, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 0, 0, 0.3)";
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = "#ff0000";
                    ctx.stroke();

                    ctx.font = 'bold 24px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText("❌", 0, 0);
                } else if (this.data.img) {
                    // Рисуем круглую стильную подложку под вещь
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2 + 4, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(20, 20, 20, 0.85)";
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
                    ctx.stroke();

                    // Обрезаем картинку по кругу для красоты
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                    ctx.clip();

                    try {
                        ctx.drawImage(this.data.img, -this.size/2, -this.size/2, this.size, this.size);
                    } catch(e) {}
                    ctx.restore();

                    // Название бренда под картинкой
                    ctx.font = 'bold 11px -apple-system, sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText(this.data.name, 0, this.size / 2 + 6);
                }

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12;
                this.alpha = 1;
                this.color = '#ffffff';
                this.size = Math.random() * 6 + 3;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        function startGame() {
            score = 0;
            missed = 0;
            items = [];
            particles = [];
            isPlaying = true;
            document.getElementById('score').innerText = score;
            document.getElementById('missed').innerText = missed;
            document.getElementById('startScreen').style.display = 'none';
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('startScreen').style.display = 'flex';
            document.querySelector('#startScreen h1').innerText = "ПОЙМАЛ ПАЛЬ!";
            document.querySelector('#startScreen p').innerText = `Твой итоговый счет: ${score}`;
        }

        function addTouch(x, y) {
            trail.push({ x, y, time: Date.now() });

            if (!isPlaying) return;

            items.forEach(item => {
                if (!item.sliced) {
                    let dist = Math.hypot(item.x - x, item.y - y);
                    if (dist < 50) {
                        item.sliced = true;
                        if (item.data.isBomb) {
                            gameOver();
                        } else {
                            score += 10;
                            document.getElementById('score').innerText = score;
                            for (let i = 0; i < 18; i++) {
                                particles.push(new Particle(item.x, item.y));
                            }
                        }
                    }
                }
            });
        }

        window.addEventListener('mousemove', e => addTouch(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => {
            let touch = e.touches[0];
            addTouch(touch.clientX, touch.clientY);
        });

        let spawnTimer = 0;

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isPlaying) {
                spawnTimer++;
                if (spawnTimer > 45) {
                    items.push(new Item());
                    spawnTimer = 0;
                }

                for (let i = items.length - 1; i >= 0; i--) {
                    let item = items[i];
                    item.update();
                    item.draw();

                    if (!item.sliced && item.y > canvas.height + 100) {
                        items.splice(i, 1);
                        if (!item.data.isBomb) {
                            missed++;
                            document.getElementById('missed').innerText = missed;
                            if (missed >= 3) gameOver();
                        }
                    } else if (item.sliced) {
                        items.splice(i, 1);
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            let now = Date.now();
            trail = trail.filter(p => now - p.time < 150);
            if (trail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) {
                    ctx.lineTo(trail[i].x, trail[i].y);
                }
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
