<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velvet Armor — Slicer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b0b0b;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 5;
        }
        .score-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
        }
        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-align: center;
        }
        p {
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="score-box">СЧЕТ: <span id="score">0</span></div>
        <div class="score-box">ПРАВЫХ: <span id="missed">0</span> / 3</div>
    </div>

    <div id="startScreen">
        <h1>V / A — SLICER</h1>
        <p>Режь брендовый шмот, обходи паленку</p>
        <button class="btn" onclick="startGame()">ИГРАТЬ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let missed = 0;
        let isPlaying = false;
        let items = [];
        let particles = [];
        let trail = [];

        // Полный гардероб: футболки, кроссовки, зипки и куртки
        const itemTypes = [
            // Stone Island
            { name: "Stone Island Tee", accent: "#3498db", badge: "TEE" },
            { name: "Stone Island Jacket", accent: "#2980b9", badge: "JACKET" },
            // Valentino
            { name: "Valentino Sneakers", accent: "#9b59b6", badge: "SNEAKERS" },
            { name: "Valentino Hoodie", accent: "#8e44ad", badge: "HOODIE" },
            // Gucci
            { name: "Gucci Tee", accent: "#1abc9c", badge: "TEE" },
            { name: "Gucci Jacket", accent: "#16a085", badge: "OUTERWEAR" },
            // Givenchy
            { name: "Givenchy Tee", accent: "#e67e22", badge: "TEE" },
            // Raf Simons
            { name: "Raf Simons Archive", accent: "#f1c40f", badge: "ARCHIVE" },
            { name: "Raf Simons Runner", accent: "#f39c12", badge: "SNEAKERS" },
            // Rick Owens
            { name: "Rick Owens Geobasket", accent: "#ffffff", badge: "FOOTWEAR" },
            { name: "Rick Owens Bomber", accent: "#bdc3c7", badge: "JACKET" },
            // Off-White
            { name: "Off-White Tee", accent: "#e74c3c", badge: "TEE" },
            { name: "Off-White Hoodie", accent: "#c0392b", badge: "HOODIE" },
            // Nike & Puma
            { name: "Nike Sneakers", accent: "#34495e", badge: "SNEAKERS" },
            { name: "Puma Archive", accent: "#d35400", badge: "KICKS" },
            // Maison Margiela
            { name: "Margiela Tabi", accent: "#e84393", badge: "TABI" },
            { name: "Margiela Tee", accent: "#fd79a8", badge: "TEE" },
            // Зипки и олимпийки
            { name: "Olimpika Zip", accent: "#2ecc71", badge: "ZIP-HOODIE" },
            { name: "Olimpika Jacket", accent: "#27ae60", badge: "JACKET" },
            // Анти-хит
            { name: "❌ Убитая реплика", accent: "#ff0000", badge: "FAKE", isBomb: true }
        ];

        class Item {
            constructor() {
                this.x = Math.random() * (canvas.width - 170) + 85;
                this.y = canvas.height + 70;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = -(Math.random() * 5 + 13);
                this.gravity = 0.35;
                this.data = itemTypes[Math.floor(Math.random() * itemTypes.length)];
                this.width = 170;
                this.height = 70;
                this.sliced = false;
                this.angle = 0;
                this.vAngle = (Math.random() - 0.5) * 0.08;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.angle += this.vAngle;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Отрисовка глянцевой карточки товара
                ctx.beginPath();
                let w = this.width;
                let h = this.height;
                let radius = 12;
                
                ctx.moveTo(-w/2 + radius, -h/2);
                ctx.lineTo(w/2 - radius, -h/2);
                ctx.quadraticCurveTo(w/2, -h/2, w/2, -h/2 + radius);
                ctx.lineTo(w/2, h/2 - radius);
                ctx.quadraticCurveTo(w/2, h/2, w/2 - radius, h/2);
                ctx.lineTo(-w/2 + radius, h/2);
                ctx.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - radius);
                ctx.lineTo(-w/2, -h/2 + radius);
                ctx.quadraticCurveTo(-w/2, -h/2, -w/2 + radius, -h/2);
                ctx.closePath();

                ctx.fillStyle = this.data.isBomb ? 'rgba(255, 0, 0, 0.28)' : 'rgba(15, 15, 15, 0.94)';
                ctx.fill();
                
                ctx.lineWidth = 3;
                ctx.strokeStyle = this.data.accent;
                ctx.stroke();

                // Бейдж категории
                ctx.font = 'bold 10px -apple-system, sans-serif';
                ctx.fillStyle = this.data.accent;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(this.data.badge, 0, -h/2 + 8);

                // Название вещи
                ctx.font = 'bold 13px -apple-system, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.data.name, 0, 6);

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12;
                this.alpha = 1;
                this.color = color;
                this.size = Math.random() * 6 + 3;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        function startGame() {
            score = 0;
            missed = 0;
            items = [];
            particles = [];
            isPlaying = true;
            document.getElementById('score').innerText = score;
            document.getElementById('missed').innerText = missed;
            document.getElementById('startScreen').style.display = 'none';
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('startScreen').style.display = 'flex';
            document.querySelector('#startScreen h1').innerText = "ПОЙМАЛ ПАЛЬ!";
            document.querySelector('#startScreen p').innerText = `Твой итоговый счет: ${score}`;
        }

        function addTouch(x, y) {
            trail.push({ x, y, time: Date.now() });

            if (!isPlaying) return;

            items.forEach(item => {
                if (!item.sliced) {
                    let dist = Math.hypot(item.x - x, item.y - y);
                    if (dist < 70) {
                        item.sliced = true;
                        if (item.data.isBomb) {
                            gameOver();
                        } else {
                            score += 10;
                            document.getElementById('score').innerText = score;
                            for (let i = 0; i < 18; i++) {
                                particles.push(new Particle(item.x, item.y, item.data.accent));
                            }
                        }
                    }
                }
            });
        }

        window.addEventListener('mousemove', e => addTouch(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => {
            let touch = e.touches[0];
            addTouch(touch.clientX, touch.clientY);
        });

        let spawnTimer = 0;

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isPlaying) {
                spawnTimer++;
                if (spawnTimer > 40) {
                    items.push(new Item());
                    spawnTimer = 0;
                }

                for (let i = items.length - 1; i >= 0; i--) {
                    let item = items[i];
                    item.update();
                    item.draw();

                    if (!item.sliced && item.y > canvas.height + 100) {
                        items.splice(i, 1);
                        if (!item.data.isBomb) {
                            missed++;
                            document.getElementById('missed').innerText = missed;
                            if (missed >= 3) gameOver();
                        }
                    } else if (item.sliced) {
                        items.splice(i, 1);
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            let now = Date.now();
            trail = trail.filter(p => now - p.time < 150);
            if (trail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) {
                    ctx.lineTo(trail[i].x, trail[i].y);
                }
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
